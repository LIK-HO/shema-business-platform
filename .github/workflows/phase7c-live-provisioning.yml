name: Phase 7C Live Provisioning and Evidence

on:
  workflow_call:
    inputs:
      source_ref:
        description: "Exact source branch/ref to deploy and verify."
        required: true
        type: string
      apply:
        description: "After reviewing the Terraform plan produced in this workflow run, allow the protected apply job to execute."
        required: true
        default: false
        type: boolean
      rollback_drill:
        description: "After apply and smoke, prove rollback to the prior immutable revision and restore the new revision."
        required: true
        default: false
        type: boolean
      pitr_drill:
        description: "Restore to a separate temporary PostgreSQL cluster and verify recovery through a private task."
        required: true
        default: false
        type: boolean
      pitr_recovery_time:
        description: "RFC3339 UTC recovery target, after an available automated backup and not in the future."
        required: false
        default: ""
        type: string
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Exact source branch/ref to deploy and verify. Defaults to the selected workflow branch."
        required: false
        default: ""
        type: string
      apply:
        description: "After reviewing the Terraform plan produced in this workflow run, allow the protected apply job to execute."
        required: true
        default: false
        type: boolean
      rollback_drill:
        description: "After apply and smoke, prove rollback to the prior immutable revision and restore the new revision."
        required: true
        default: false
        type: boolean
      pitr_drill:
        description: "Restore to a separate temporary PostgreSQL cluster and verify recovery through a private task."
        required: true
        default: false
        type: boolean
      pitr_recovery_time:
        description: "RFC3339 UTC recovery target, after an available automated backup and not in the future."
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: phase7c-production
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    environment: production-yandex
    outputs:
      previous_revision_id: ${{ steps.capture_previous_revision.outputs.revision_id }}
      planned_change_fingerprint: ${{ steps.plan_fingerprint.outputs.fingerprint }}
      image_url: ${{ steps.bootstrap_image.outputs.image_url }}
      image_digest: ${{ steps.bootstrap_image.outputs.image_digest }}
      source_sha: ${{ steps.source_identity.outputs.source_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve exact source revision
        id: source_identity
        env:
          SOURCE_REF: ${{ inputs.source_ref || github.ref }}
        run: |
          set -Eeuo pipefail
          if [[ "$SOURCE_REF" == refs/* ]]; then
            git fetch --no-tags --prune --depth=1 origin "$SOURCE_REF"
            git checkout --detach "$SOURCE_REF"
          else
            git fetch --no-tags --prune --depth=1 origin "$SOURCE_REF"
            git checkout --detach "origin/$SOURCE_REF"
          fi
          source_sha="$(git rev-parse HEAD)"
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]]
          echo "source_ref=$SOURCE_REF"
          echo "source_sha=$source_sha"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"

      - name: Install Yandex Cloud CLI
        run: |
          curl -fsSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash
          echo "$HOME/yandex-cloud/bin" >> "$GITHUB_PATH"
      - name: Configure Yandex Cloud credentials
        env:
          YC_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.YC_SERVICE_ACCOUNT_KEY_JSON }}
        run: |
          test -n "$YC_SERVICE_ACCOUNT_KEY_JSON"
          mkdir -p "$RUNNER_TEMP/yc"
          printf "%s" "$YC_SERVICE_ACCOUNT_KEY_JSON" > "$RUNNER_TEMP/yc/key.json"
          yc config profile create shema-phase7c
          yc config set service-account-key "$RUNNER_TEMP/yc/key.json"
      - name: Verify persistent Terraform state backend
        env:
          YC_TERRAFORM_STATE_BUCKET: ${{ secrets.PHASE7C_TERRAFORM_STATE_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.PHASE7C_TERRAFORM_STATE_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.PHASE7C_TERRAFORM_STATE_SECRET_KEY }}
          AWS_DEFAULT_REGION: ru-central1
        run: bash scripts/yandex_cloud_terraform_state_preflight.sh

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "1.16.4"
          terraform_wrapper: false
      - name: Write private Terraform variables
        env:
          TFVARS_JSON: ${{ secrets.PHASE7C_TFVARS_JSON }}
        run: |
          test -n "$TFVARS_JSON"
          printf "%s" "$TFVARS_JSON" > deploy/terraform/terraform.tfvars.json
          python - <<'PY'
          import json
          from pathlib import Path
          values = json.loads(
              Path("deploy/terraform/terraform.tfvars.json").read_text(encoding="utf-8")
          )
          if values.get("evidence_runner_enabled") is not True:
              raise SystemExit("Phase 7C live provisioning requires evidence_runner_enabled=true")
          if values.get("database_secret_version", 0) < 1:
              raise SystemExit("Phase 7C requires database_secret_version >= 1")
          if values.get("availability_zones") != ["ru-central1-d", "ru-central1-b", "ru-central1-a"]:
              raise SystemExit("Phase 7C requires all three ru-central1 availability zones")
          for key in (
              "cloud_id",
              "folder_id",
              "oidc_issuer",
              "oidc_audience",
              "oidc_jwks_url",
              "bucket_name",
              "database_name",
              "database_user",
              "database_secret_input",
              "database_secret_version",
              "availability_zones",
          ):
              if not values.get(key):
                  raise SystemExit(f"Phase 7C requires protected Terraform input: {key}")
          PY
      - name: Terraform init
        env:
          PHASE7C_TERRAFORM_STATE_BUCKET: ${{ secrets.PHASE7C_TERRAFORM_STATE_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.PHASE7C_TERRAFORM_STATE_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.PHASE7C_TERRAFORM_STATE_SECRET_KEY }}
        run: |
          terraform -chdir=deploy/terraform init -input=false \
            -backend-config="bucket=$PHASE7C_TERRAFORM_STATE_BUCKET"

      - name: Bootstrap registry and publish immutable application image
        id: bootstrap_image
        env:
          YC_FOLDER_ID: ${{ secrets.PHASE7C_FOLDER_ID }}
        run: |
          set -Eeuo pipefail
          eval "$(python - <<'PY'
          import json
          from pathlib import Path

          values = json.loads(Path("deploy/terraform/terraform.tfvars.json").read_text(encoding="utf-8"))
          app_name = values.get("app_name", "shema")
          print(f"export APP_NAME={json.dumps(app_name)}")
          print(f"export REGISTRY_NAME={json.dumps(app_name + "-images")}")
          PY
          )"

          set +e
          registry_lookup_output="$(yc container registry get "$REGISTRY_NAME" --folder-id "$YC_FOLDER_ID" --format=json 2>&1)"
          registry_lookup_rc=$?
          set -e

          if (( registry_lookup_rc == 0 )); then
            registry_id="$(printf '%s' "$registry_lookup_output" | jq -r '.id // empty')"
            test -n "$registry_id"
          else
            if grep -qiE 'PermissionDenied|permission denied|PERMISSION_DENIED' <<<"$registry_lookup_output"; then
              echo "CONTAINER_REGISTRY_LOOKUP=FAIL"
              echo "CONTAINER_REGISTRY_ERROR_CLASS=ACCESS_DENIED"
              echo "CONTAINER_REGISTRY_REQUIRED_ROLE=container-registry.editor"
              echo "CONTAINER_REGISTRY_ERROR_OUTPUT=SUPPRESSED"
              exit 1
            fi

            if ! grep -qiE 'NotFound|not found|NOT_FOUND' <<<"$registry_lookup_output"; then
              echo "CONTAINER_REGISTRY_LOOKUP=FAIL"
              echo "CONTAINER_REGISTRY_ERROR_CLASS=UNCLASSIFIED"
              echo "CONTAINER_REGISTRY_ERROR_OUTPUT=SUPPRESSED"
              exit 1
            fi

            set +e
            registry_create_output="$(yc container registry create --name "$REGISTRY_NAME" --folder-id "$YC_FOLDER_ID" 2>&1)"
            registry_create_rc=$?
            set -e
            if (( registry_create_rc != 0 )); then
              if grep -qiE 'PermissionDenied|permission denied|PERMISSION_DENIED' <<<"$registry_create_output"; then
                echo "CONTAINER_REGISTRY_CREATE=FAIL"
                echo "CONTAINER_REGISTRY_ERROR_CLASS=ACCESS_DENIED"
                echo "CONTAINER_REGISTRY_REQUIRED_ROLE=container-registry.editor"
                echo "CONTAINER_REGISTRY_ERROR_OUTPUT=SUPPRESSED"
                exit 1
              fi
              echo "CONTAINER_REGISTRY_CREATE=FAIL"
              echo "CONTAINER_REGISTRY_ERROR_CLASS=UNCLASSIFIED"
              echo "CONTAINER_REGISTRY_ERROR_OUTPUT=SUPPRESSED"
              exit 1
            fi

            registry_id="$(yc container registry get "$REGISTRY_NAME" --folder-id "$YC_FOLDER_ID" --format=json | jq -r '.id // empty')"
            test -n "$registry_id"
          fi

          if ! terraform -chdir=deploy/terraform state show yandex_container_registry.app >/dev/null 2>&1; then
            terraform -chdir=deploy/terraform import -input=false               yandex_container_registry.app "$registry_id"
          fi

          yc container registry configure-docker --profile shema-phase7c

          image_tag="${{ steps.source_identity.outputs.source_sha }}"
          image_url="cr.yandex/$registry_id/$APP_NAME:$image_tag"
          image_digest="$(yc container image list             --repository-name="$registry_id/$APP_NAME"             --format=json 2>/dev/null |
            jq -r --arg tag "$image_tag" '(.images // .)[]? | select((.tags // []) | index($tag)) | .digest' |
            head -n1 || true)"

          if [[ -z "$image_digest" ]]; then
            docker build --tag "$image_url" .
            docker push "$image_url" >/dev/null
            image_digest="$(yc container image list               --repository-name="$registry_id/$APP_NAME"               --format=json |
              jq -r --arg tag "$image_tag" '(.images // .)[]? | select((.tags // []) | index($tag)) | .digest' |
              head -n1)"
          fi

          test "$image_digest" =~ ^sha256:[0-9a-f]{64}$

          IMAGE_URL="$image_url" IMAGE_DIGEST="$image_digest" python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path("deploy/terraform/terraform.tfvars.json")
          values = json.loads(path.read_text(encoding="utf-8"))
          values["image_url"] = os.environ["IMAGE_URL"]
          values["image_digest"] = os.environ["IMAGE_DIGEST"]
          path.write_text(
              json.dumps(values, ensure_ascii=False, sort_keys=True, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

          echo "image_url=$image_url" >> "$GITHUB_OUTPUT"
          echo "image_digest=$image_digest" >> "$GITHUB_OUTPUT"

      - name: Terraform plan
        run: |
          set -Eeuo pipefail
          terraform -chdir=deploy/terraform plan \
            -input=false \
            -var-file=terraform.tfvars.json \
            -out="$RUNNER_TEMP/phase7c.tfplan"

      - name: Fingerprint reviewed Terraform plan
        id: plan_fingerprint
        run: |
          set -Eeuo pipefail
          terraform -chdir=deploy/terraform show -no-color \
            "$RUNNER_TEMP/phase7c.tfplan" > "$RUNNER_TEMP/phase7c-plan.txt"
          fingerprint="$(sha256sum "$RUNNER_TEMP/phase7c-plan.txt" | awk '{print $1}')"
          test -n "$fingerprint"
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"
          echo "Terraform plan fingerprint: $fingerprint"

      - name: Capture previous active revision
        id: capture_previous_revision
        env:
          YC_CONTAINER_NAME: ${{ secrets.PHASE7C_CONTAINER_NAME }}
        run: |
          if ! yc serverless container get "$YC_CONTAINER_NAME" >/dev/null 2>&1; then
            echo "revision_id=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          revision_id="$(yc serverless container revision list --container-name "$YC_CONTAINER_NAME" --format=json | jq -r '[.[] | select(.status == "ACTIVE") | .id][0] // empty')"
          echo "revision_id=$revision_id" >> "$GITHUB_OUTPUT"

  apply:
    needs: plan
    if: ${{ inputs.apply == true }}
    runs-on: ubuntu-latest
    environment: production-yandex
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify exact source revision
        env:
          SOURCE_REF: ${{ inputs.source_ref || github.ref }}
          EXPECTED_SOURCE_SHA: ${{ needs.plan.outputs.source_sha }}
        run: |
          set -Eeuo pipefail
          if [[ "$SOURCE_REF" == refs/* ]]; then
            git fetch --no-tags --prune --depth=1 origin "$SOURCE_REF"
            git checkout --detach "$SOURCE_REF"
          else
            git fetch --no-tags --prune --depth=1 origin "$SOURCE_REF"
            git checkout --detach "origin/$SOURCE_REF"
          fi
          actual_source_sha="$(git rev-parse HEAD)"
          test "$actual_source_sha" = "$EXPECTED_SOURCE_SHA" || {
            echo "Source ref changed between plan and apply; refusing deployment."
            exit 1
          }

      - name: Install Yandex Cloud CLI
        run: |
          curl -fsSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash
          echo "$HOME/yandex-cloud/bin" >> "$GITHUB_PATH"
      - name: Configure Yandex Cloud credentials
        env:
          YC_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.YC_SERVICE_ACCOUNT_KEY_JSON }}
        run: |
          test -n "$YC_SERVICE_ACCOUNT_KEY_JSON"
          mkdir -p "$RUNNER_TEMP/yc"
          printf "%s" "$YC_SERVICE_ACCOUNT_KEY_JSON" > "$RUNNER_TEMP/yc/key.json"
          yc config profile create shema-phase7c
          yc config set service-account-key "$RUNNER_TEMP/yc/key.json"
      - name: Verify persistent Terraform state backend
        env:
          YC_TERRAFORM_STATE_BUCKET: ${{ secrets.PHASE7C_TERRAFORM_STATE_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.PHASE7C_TERRAFORM_STATE_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.PHASE7C_TERRAFORM_STATE_SECRET_KEY }}
          AWS_DEFAULT_REGION: ru-central1
        run: bash scripts/yandex_cloud_terraform_state_preflight.sh

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "1.16.4"
          terraform_wrapper: false
      - name: Write private Terraform variables
        env:
          TFVARS_JSON: ${{ secrets.PHASE7C_TFVARS_JSON }}
        run: |
          test -n "$TFVARS_JSON"
          printf "%s" "$TFVARS_JSON" > deploy/terraform/terraform.tfvars.json
      - name: Terraform init
        env:
          PHASE7C_TERRAFORM_STATE_BUCKET: ${{ secrets.PHASE7C_TERRAFORM_STATE_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.PHASE7C_TERRAFORM_STATE_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.PHASE7C_TERRAFORM_STATE_SECRET_KEY }}
        run: |
          terraform -chdir=deploy/terraform init -input=false \
            -backend-config="bucket=$PHASE7C_TERRAFORM_STATE_BUCKET"

      - name: Resolve reviewed immutable image
        env:
          EXPECTED_IMAGE_DIGEST: ${{ needs.plan.outputs.image_digest }}
        run: |
          set -Eeuo pipefail
          eval "$(python - <<'PY'
          import json
          from pathlib import Path

          values = json.loads(Path("deploy/terraform/terraform.tfvars.json").read_text(encoding="utf-8"))
          app_name = values.get("app_name", "shema")
          print(f"export APP_NAME={json.dumps(app_name)}")
          PY
          )"
          registry_id="$(terraform -chdir=deploy/terraform output -raw registry_id)"
          image_tag="${{ needs.plan.outputs.source_sha }}"
          image_url="cr.yandex/$registry_id/$APP_NAME:$image_tag"
          image_digest="$(yc container image list             --repository-name="$registry_id/$APP_NAME"             --format=json |
            jq -r --arg tag "$image_tag" '(.images // .)[]? | select((.tags // []) | index($tag)) | .digest' |
            head -n1)"
          test "$image_digest" = "$EXPECTED_IMAGE_DIGEST"
          IMAGE_URL="$image_url" IMAGE_DIGEST="$image_digest" python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path("deploy/terraform/terraform.tfvars.json")
          values = json.loads(path.read_text(encoding="utf-8"))
          values["image_url"] = os.environ["IMAGE_URL"]
          values["image_digest"] = os.environ["IMAGE_DIGEST"]
          path.write_text(
              json.dumps(values, ensure_ascii=False, sort_keys=True, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Recompute and verify reviewed Terraform plan
        env:
          EXPECTED_PLAN_FINGERPRINT: ${{ needs.plan.outputs.planned_change_fingerprint }}
          AWS_ACCESS_KEY_ID: ${{ secrets.PHASE7C_TERRAFORM_STATE_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.PHASE7C_TERRAFORM_STATE_SECRET_KEY }}
        run: |
          set -Eeuo pipefail
          terraform -chdir=deploy/terraform plan \
            -input=false \
            -var-file=terraform.tfvars.json \
            -out="$RUNNER_TEMP/phase7c.tfplan"
          terraform -chdir=deploy/terraform show -no-color \
            "$RUNNER_TEMP/phase7c.tfplan" > "$RUNNER_TEMP/phase7c-plan.txt"
          actual_fingerprint="$(sha256sum "$RUNNER_TEMP/phase7c-plan.txt" | awk '{print $1}')"
          test -n "$EXPECTED_PLAN_FINGERPRINT"
          test "$actual_fingerprint" = "$EXPECTED_PLAN_FINGERPRINT" || {
            echo "Terraform plan fingerprint changed between review and apply; refusing deployment."
            exit 1
          }
          echo "Terraform plan fingerprint verified: $actual_fingerprint"

      - name: Terraform apply reviewed plan
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.PHASE7C_TERRAFORM_STATE_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.PHASE7C_TERRAFORM_STATE_SECRET_KEY }}
        run: terraform -chdir=deploy/terraform apply -input=false "$RUNNER_TEMP/phase7c.tfplan"

      - name: Collect live resource evidence
        env:
          YC_CLOUD_ID: ${{ secrets.PHASE7C_CLOUD_ID }}
          YC_FOLDER_ID: ${{ secrets.PHASE7C_FOLDER_ID }}
          YC_CONTAINER_NAME: ${{ secrets.PHASE7C_CONTAINER_NAME }}
          YC_MIGRATION_RUNNER_NAME: ${{ secrets.PHASE7C_MIGRATION_RUNNER_NAME }}
          YC_CLUSTER_NAME: ${{ secrets.PHASE7C_CLUSTER_NAME }}
          YC_BUCKET_NAME: ${{ secrets.PHASE7C_BUCKET_NAME }}
          YC_BUDGET_ID: ${{ secrets.PHASE7C_BUDGET_ID }}
          YC_TERRAFORM_STATE_BUCKET: ${{ secrets.PHASE7C_TERRAFORM_STATE_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.PHASE7C_TERRAFORM_STATE_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.PHASE7C_TERRAFORM_STATE_SECRET_KEY }}
          AWS_DEFAULT_REGION: ru-central1
        run: |
          set -Eeuo pipefail
          export YC_API_GATEWAY_ID="$(terraform -chdir=deploy/terraform output -raw api_gateway_id)"
          export YC_RUNTIME_LOG_GROUP_ID="$(terraform -chdir=deploy/terraform output -raw runtime_log_group_id)"
          export YC_AUDIT_LOG_GROUP_ID="$(terraform -chdir=deploy/terraform output -raw audit_log_group_id)"
          export YC_AUDIT_TRAIL_ID="$(terraform -chdir=deploy/terraform output -raw audit_trail_id)"
          export YC_REGISTRY_SCAN_POLICY_ID="$(terraform -chdir=deploy/terraform output -raw registry_scan_policy_id)"
          export YC_EXPECTED_IMAGE_DIGEST="$(python - <<'PY'
          import json
          from pathlib import Path
          values = json.loads(Path("deploy/terraform/terraform.tfvars.json").read_text(encoding="utf-8"))
          value = values.get("image_digest")
          if not value:
              raise SystemExit("image_digest is required")
          print(value)
          PY
          )"
          bash scripts/yandex_cloud_live_evidence.sh

      - name: Run protected rollback drill
        if: ${{ inputs.rollback_drill == true }}
        env:
          YC_CONTAINER_NAME: ${{ secrets.PHASE7C_CONTAINER_NAME }}
          PREVIOUS_REVISION_ID: ${{ needs.plan.outputs.previous_revision_id }}
        run: |
          test -n "$PREVIOUS_REVISION_ID" || {
            echo "rollback_drill requires a previously active production revision."
            exit 1
          }
          bash scripts/yandex_cloud_rollback_drill.sh

      - name: Run protected PITR recovery drill
        if: ${{ inputs.pitr_drill == true }}
        env:
          YC_FOLDER_ID: ${{ secrets.PHASE7C_FOLDER_ID }}
          YC_CLUSTER_NAME: ${{ secrets.PHASE7C_CLUSTER_NAME }}
          YC_MIGRATION_RUNNER_NAME: ${{ secrets.PHASE7C_MIGRATION_RUNNER_NAME }}
          PITR_RECOVERY_TIME: ${{ inputs.pitr_recovery_time }}
        run: |
          set -Eeuo pipefail
          test -n "$PITR_RECOVERY_TIME"
          PITR_DATABASE_URL="$(terraform -chdir=deploy/terraform output -raw database_url)"
          PITR_INVOCATION_SERVICE_ACCOUNT_ID="$(terraform -chdir=deploy/terraform output -raw container_puller_service_account_id)"
          test -n "$PITR_INVOCATION_SERVICE_ACCOUNT_ID"
          export PITR_DATABASE_URL PITR_INVOCATION_SERVICE_ACCOUNT_ID
          bash scripts/yandex_cloud_pitr_drill.sh
