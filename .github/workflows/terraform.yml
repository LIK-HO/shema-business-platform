name: Terraform IaC Validation

on:
  pull_request:
    paths:
      - "deploy/terraform/**"
      - "architecture/yandex_cloud_production_contract.json"
      - ".github/workflows/terraform.yml"
  push:
    branches: ["main", "v1.4-kernel-hardening"]
    paths:
      - "deploy/terraform/**"
      - "architecture/yandex_cloud_production_contract.json"
      - ".github/workflows/terraform.yml"

permissions:
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "1.16.4"
          terraform_wrapper: false

      - name: Format check
        run: terraform fmt -diff -recursive deploy/terraform

      - name: Initialize provider schemas
        run: terraform -chdir=deploy/terraform init -backend=false -input=false

      - name: Validate configuration
        run: terraform -chdir=deploy/terraform validate
