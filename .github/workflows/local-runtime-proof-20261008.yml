name: Local Runtime Proof

on:
  push:
    branches:
      - fix/local-runtime-composition-20261008
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  runtime:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact fix branch
        uses: actions/checkout@3d3c42c5a9a9d5b08b1baf7d1a2f31dd7e8a4e0f # v5.0.0
        with:
          ref: fix/local-runtime-composition-20261008
          persist-credentials: false

      - name: Build production image
        run: docker build --pull -t shema-local-runtime-proof .

      - name: Start production container
        run: |
          docker run -d --name shema-local-runtime-proof -p 18080:8080             -e APP_ENV=production             -e OIDC_ISSUER=https://issuer.example.com/             -e OIDC_AUDIENCE=shema-business-platform             -e OIDC_JWKS_URL=https://issuer.example.com/.well-known/jwks.json             -e DATABASE_URL='postgresql://app:secret@db.internal:5432/shema'             shema-local-runtime-proof

      - name: Verify HTTP and readiness
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/ >/tmp/root.html; then break; fi
            sleep 1
          done
          curl -fsS -D /tmp/ready.headers -o /tmp/ready.json http://127.0.0.1:18080/health/ready
          grep -q '"ready":true' /tmp/ready.json
          grep -qi '^x-content-type-options: nosniff' /tmp/ready.headers
          grep -qi '^x-frame-options: DENY' /tmp/ready.headers
          grep -qi '^x-correlation-id: ' /tmp/ready.headers
          grep -q 'Shema' /tmp/root.html

      - name: Inspect canonical application composition
        run: |
          docker exec shema-local-runtime-proof             python -c "from shema_platform.experience.production import app; assert app.state.application is not None; print(type(app.state.application).__name__)"

      - name: Prove capability fail-closed
        run: |
          docker exec shema-local-runtime-proof             python -c "from starlette.testclient import TestClient; from shema_platform.experience.production import app; r=TestClient(app).post('/v1/search', json={'region':'Moscow','industries':['logistics']}); assert r.status_code in (401, 503), r.text"

      - name: Verify container remains alive
        run: docker inspect -f '{{.State.Running}}' shema-local-runtime-proof | grep true

      - name: Dump logs on failure
        if: failure()
        run: docker logs shema-local-runtime-proof

      - name: Cleanup
        if: always()
        run: docker rm -f shema-local-runtime-proof || true
