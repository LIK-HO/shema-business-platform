name: Phase 7C Production Launcher

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "After reviewing the Terraform plan, authorize the protected Yandex Cloud apply."
        required: true
        default: false
        type: boolean
      rollback_drill:
        description: "After apply and smoke, run the protected rollback drill."
        required: true
        default: false
        type: boolean
      pitr_drill:
        description: "After apply and smoke, run the protected PostgreSQL PITR drill."
        required: true
        default: false
        type: boolean
      pitr_recovery_time:
        description: "RFC3339 UTC PITR target after an available automated backup."
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  phase7c:
    uses: LIK-HO/shema-business-platform/.github/workflows/phase7c-live-provisioning.yml@phase7c/yandex-cloud-mature-baseline-20261004
    with:
      source_ref: phase7c/yandex-cloud-mature-baseline-20261004
      apply: ${{ inputs.apply }}
      rollback_drill: ${{ inputs.rollback_drill }}
      pitr_drill: ${{ inputs.pitr_drill }}
      pitr_recovery_time: ${{ inputs.pitr_recovery_time }}
    secrets: inherit
