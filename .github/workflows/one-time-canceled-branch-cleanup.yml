name: One-time canceled branch cleanup

on:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  delete-canceled-branch:
    if: ${{ github.event.head_commit.message == 'chore: remove canceled deployment branch' }}
    runs-on: ubuntu-latest
    steps:
      - name: Delete the exact canceled feature ref
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api --method DELETE "repos/${REPOSITORY}/git/refs/heads/feature/replit-deployment-20261101"
