name: Phase 7C One-Shot Production Deploy
# Temporary release trigger; remove after successful production acceptance.
# Source branch is CI-accepted and pinned by the reusable workflow at run start.
# Deployment source is the current CI-accepted Phase 7C branch.

on:
  push:
    branches:
      - main
    paths:
      - ".github/phase7c-production-deploy.trigger"

permissions:
  contents: read

jobs:
  deploy:
    uses: LIK-HO/shema-business-platform/.github/workflows/phase7c-live-provisioning.yml@phase7c/yandex-cloud-mature-baseline-20261004
    with:
      source_ref: phase7c/yandex-cloud-mature-baseline-20261004
      apply: true
      rollback_drill: false
      pitr_drill: false
      pitr_recovery_time: ""
    secrets: inherit

# trigger production deploy on current Phase 7C branch head
