<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="500" height="500">
  <!-- Фон отсутствует, поэтому он прозрачный -->
  <g fill="#0033A0"> <!-- Более яркий и контрастный синий -->
    <!-- Внешний левый угол -->
    <rect x="40" y="40" width="30" height="80" />
    <rect x="40" y="120" width="30" height="40" />
    <!-- Внешний нижний левый -->
    <rect x="40" y="140" width="60" height="20" />
    <rect x="40" y="160" width="80" height="20" />
    <!-- Верхние блоки -->
    <rect x="80" y="40" width="40" height="20" />
    <rect x="130" y="40" width="30" height="20" />
    <!-- Внутренний верхний блок -->
    <rect x="60" y="60" width="50" height="20" />
    <rect x="110" y="60" width="50" height="20" />
    <!-- Центральные блоки -->
    <rect x="60" y="80" width="20" height="30" />
    <rect x="80" y="80" width="30" height="15" />
    <rect x="130" y="80" width="30" height="15" />
    <!-- Внутренние нижние блоки -->
    <rect x="80" y="110" width="20" height="30" />
    <rect x="80" y="120" width="30" height="15" />
    <rect x="110" y="120" width="50" height="15" />
    <!-- Нижние блоки -->
    <rect x="90" y="140" width="40" height="20" />
    <rect x="130" y="140" width="30" height="20" />
    <!-- Нижний правый блок -->
    <rect x="110" y="160" width="50" height="20" />
  </g>
</svg>